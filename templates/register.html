<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <h1>📝 Register</h1>

        {% if error %}
            <p class="error">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button class="edit-btn"
                    type="submit">

                Register

            </button>

        </form>

        <p>

            Already have an account?

            <a href="/login">
                Login Here
            </a>

        </p>

    </div>

</div>

</body>
</html>
