<!DOCTYPE html>
<html>
<head>

    <title>Change Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <h1>
            🔒 Change Password
        </h1>

        {% if error %}
            <p style="color:red;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <input type="password"
                   name="old_password"
                   placeholder="Old Password"
                   required>

            <input type="password"
                   name="new_password"
                   placeholder="New Password"
                   required>

            <button class="pass-btn"
                    type="submit">

                Update Password

            </button>

        </form>

        <a href="/dashboard">

            <button class="logout-btn">

                🔙 Back

            </button>

        </a>

    </div>

</div>

</body>
</html>
