<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <h1>🔐 Login</h1>

        {% if error %}
            <p style="color:red;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button class="edit-btn"
                    type="submit">

                Login

            </button>

        </form>

        <p>
         Don't have an account?

            <a href="/register">
                Register Here
            </a>
        </p>

    </div>

</div>

</body>
</html>
